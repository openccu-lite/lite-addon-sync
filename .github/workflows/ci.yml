name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: go (accounts, provider, api, package; the real rclone against a WebDAV server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # the Go openccu-lite's image builds its system service with; go.mod names only the minimum
          go-version: '1.27.2'
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # pinned, as occulited pins it: @latest follows staticcheck's own Go requirement and went red by itself
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      # the pinned rclone, checked against its SHA-256: test/e2e runs it against rclone's own WebDAV
      # server and a stand-in OAuth provider (no cloud account)
      - run: scripts/fetch-rclone.sh x86_64
      - run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/lite-sync ./cmd/lite-sync && /tmp/lite-sync -version

  ui:
    name: ui (svelte-check, vitest, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # the Go openccu-lite's image builds its system service with; go.mod names only the minimum
          go-version: '1.27.2'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: scripts/fetch-rclone.sh x86_64
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui

  package:
    name: packages (aarch64, x86_64)
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # the Go openccu-lite's image builds its system service with; go.mod names only the minimum
          go-version: '1.27.2'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: VERSION=0.0.0-ci scripts/build.sh
      - run: tar tzf dist/sync-x86_64-0.0.0-ci.tar.gz | sort
      - run: for f in ./openccu-lite.json ./update_script ./sync/bin/lite-sync ./sync/bin/rclone ./sync/etc/lighttpd.conf ./sync/licences/rclone-COPYING; do tar tzf dist/sync-x86_64-0.0.0-ci.tar.gz | grep -qx "$f" || { echo "missing $f"; exit 1; }; done
      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          retention-days: 7
