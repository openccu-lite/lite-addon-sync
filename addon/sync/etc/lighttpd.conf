# etc/lighttpd.conf of lite-addon-sync (MIT): openccu-lite proxies /addons/sync/ to the daemon on
# the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/sync" {
    url.redirect = ("" => "/addons/sync/")
}
$HTTP["url"] =~ "^/addons/sync/" {
    proxy.server = ("/addons/sync/" => (("host" => "127.0.0.1", "port" => 8292)))
    server.errorfile-prefix = "/usr/local/addons/sync/www/lighttpd-error-"
}
